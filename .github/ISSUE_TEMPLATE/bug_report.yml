name: 🐛 Bug report
description: Something is not working as expected? Let me know.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! 🙌
        Please fill in as much as you can, it really helps me track things down.
  - type: checkboxes
    id: checks
    attributes:
      label: Before reporting
      options:
        - label: I am running the latest version of DVinyl.
          required: true
        - label: I searched the existing issues and did not find a duplicate.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can I reproduce the problem?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: DVinyl version
      placeholder: "3.0.0"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running DVinyl?
      options:
        - Docker (pre-built image)
        - Docker (built from source)
        - Manual (Node.js)
        - Other
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Affected media type or plugin
      description: If the bug is tied to a specific collection type, which one?
      placeholder: Music, Books, Movies, Games, LEGO, a custom plugin, not applicable...
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "Firefox on desktop, Safari on iPhone..."
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any relevant logs (`make docker-logs`) or drop screenshots here.
      render: shell
    validations:
      required: false
