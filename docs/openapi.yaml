openapi: 3.1.0
info:
  title: DVinyl API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Mobile/native client API for a DVinyl instance, covering authentication,
    collection, wishlist and sharing management, the full item lifecycle, plugin
    metadata, instance administration, and account settings.

    All routes are mounted under `/api/v1`. Requests and responses are JSON
    (`application/json`), except the two file-upload endpoints
    (`multipart/form-data`) and the share-link QR endpoint (`image/png`).

    Authentication is a JWT Bearer access token obtained from `POST /auth/login`.
    Access tokens live 15 minutes (`expiresIn: 900`); use the rotating refresh
    token from `POST /auth/refresh`. Collection-scoped routes are additionally
    gated on the caller's role in the collection named in the path
    (`viewer` < `editor` < `admin`); instance admins pass every collection role.
    Admin routes require `isAdmin` on the account.

    Error envelope: every failed response is `{ "success": false, "error": "..." }`
    with the HTTP status appropriate to the cause. Success responses are
    resource-shaped (e.g. `{ "item": ... }`, `{ "items": [...], "page": ... }`).

    On an instance that has not completed first-run setup, every `/api/v1`
    request returns `503` with `{ "success": false, "error": "Instance not set up yet" }`.
servers:
  - url: /api/v1
    description: DVinyl instance, API v1
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Login, token refresh/rotation, current account, logout.
  - name: Collections
    description: Collections, members, share links and browsing/statistics (collection and wishlist).
  - name: Items
    description: Single-item detail and item lifecycle operations.
  - name: Plugins
    description: Plugin metadata describing item types and their form fields.
  - name: Admin
    description: Instance-admin-only settings, users, blocked IPs and login logs.
  - name: Account
    description: Settings of the authenticated account (profile, password, avatar, SSO).
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange email and password for a token pair
      description: |
        Authenticates a local (password) account and returns an access token plus a
        rotating refresh token. Body must be JSON. Brute-force limited per email
        (same gate as the web login); a temporarily blocked email returns 429.
        Returns 403 when local login is disabled instance-wide (SSO enforced).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: you@example.com
              password: correct horse battery staple
      responses:
        '200':
          description: Authenticated. New access/refresh token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refreshToken: 9f2c1d...e4a7
                expiresIn: 900
        '400':
          description: Missing fields, or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value: { success: false, error: 'email and password are required' }
                invalid:
                  value: { success: false, error: 'Invalid email or password' }
        '403':
          description: Local login is disabled on this instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, error: 'Local login is disabled on this instance' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the authenticated account and its collections
      description: |
        Returns the account profile and every collection the caller can access,
        each with the caller's role. For an instance admin, `collections` lists
        all collections with role `admin`.
      responses:
        '200':
          description: Current account and its collections.
          content:
            application/json:
              schema:
                type: object
                required: [user, collections]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  collections:
                    type: array
                    items:
                      $ref: '#/components/schemas/Collection'
              example:
                user:
                  id: 64f1c2a9e13b2a0012ab34cd
                  username: siebe
                  email: siebe@example.com
                  isAdmin: true
                  img: /uploads/avatars/avatar-64f1c2a9e13b2a0012ab34cd-1700000000000.jpg
                  theme: dark
                  language: en
                  currency: EUR
                  hasLocalPassword: true
                  oidcLinked: false
                collections:
                  - { id: 64f1c2a9e13b2a0012ab34ce, name: Vinyl, role: admin }
                  - { id: 64f1c2a9e13b2a0012ab34cf, name: Books, role: viewer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Rotate a refresh token into a fresh token pair
      description: |
        Rotates on use: the presented refresh token is deleted and a new pair
        issued, so a leaked token stops working after the rightful owner refreshes.
        Body must be JSON. Does not require the Bearer access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: 9f2c1d...e4a7
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refreshToken: 1a2b3c...9f8e
                expiresIn: 900
        '400':
          description: refreshToken missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, error: 'refreshToken is required' }
        '401':
          description: Refresh token unknown, already rotated out, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, error: 'Invalid or expired refresh token' }
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke one refresh token (this device)
      description: |
        Deletes the single refresh-token row matching the supplied token. Other
        devices and web sessions are untouched. Idempotent. Body must be JSON.
        Does not require the Bearer access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            example:
              refreshToken: 9f2c1d...e4a7
      responses:
        '200':
          description: Token revoked (or already absent).
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, enum: [true] }
              example: { success: true }
        '400':
          description: refreshToken missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, error: 'refreshToken is required' }
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /collections:
    get:
      tags: [Collections]
      operationId: listCollections
      summary: List collections the caller can access
      description: |
        Every collection the caller is a member of, with the caller's role. For an
        instance admin, all collections are returned with role `admin`.
      responses:
        '200':
          description: Collections accessible to the caller.
          content:
            application/json:
              schema:
                type: object
                required: [collections]
                properties:
                  collections:
                    type: array
                    items:
                      $ref: '#/components/schemas/Collection'
              example:
                collections:
                  - { id: 64f1c2a9e13b2a0012ab34ce, name: Vinyl, role: admin }
                  - { id: 64f1c2a9e13b2a0012ab34cf, name: Books, role: viewer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Collections]
      operationId: createCollection
      summary: Create a new collection
      description: |
        Creates a collection owned by the caller, who becomes its `admin` member.
        Subject to instance settings: non-admin users need member collection
        creation enabled and must be under the per-user collection quota. Body
        must be JSON. Returns 403 when disallowed or over quota, 400 for a blank name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
            example:
              name: My Vinyls
      responses:
        '201':
          description: Collection created.
          content:
            application/json:
              schema:
                type: object
                required: [collection]
                properties:
                  collection:
                    $ref: '#/components/schemas/Collection'
              example:
                collection:
                  id: 64f1c2a9e13b2a0012ab34ce
                  name: My Vinyls
                  role: admin
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Creating collections is not allowed, or the collection limit is reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value: { success: false, error: 'Creating collections is not allowed' }
                quota:
                  value: { success: false, error: 'Collection limit reached' }
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /collections/{id}:
    patch:
      tags: [Collections]
      operationId: renameCollection
      summary: Rename a collection
      description: Requires `admin` role on the collection. Body must be JSON.
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameCollectionRequest'
            example:
              name: 12-inch singles
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema:
                type: object
                required: [collection]
                properties:
                  collection:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
              example:
                collection: { id: 64f1c2a9e13b2a0012ab34ce, name: 12-inch singles }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Collections]
      operationId: deleteCollection
      summary: Delete a collection and all of its contents
      description: |
        Instance-admin-only. Deletes the collection's items, settings, price
        history and the collection itself, and clears any user's last-active
        pointer to it. The default collection cannot be deleted (400).
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, enum: [true] }
              example: { success: true }
        '400':
          description: The default collection cannot be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, error: 'The default collection cannot be deleted' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /collections/{id}/members:
    get:
      tags: [Collections]
      operationId: listCollectionMembers
      summary: List a collection's members
      description: Requires `admin` role on the collection.
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      responses:
        '200':
          description: Members with their roles.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectionMember'
              example:
                members:
                  - userId: 64f1c2a9e13b2a0012ab34cd
                    username: siebe
                    email: siebe@example.com
                    img: /ressources/no-pp.jpg
                    role: admin
                  - userId: 64f1c2a9e13b2a0012ab34c0
                    username: guest
                    email: guest@example.com
                    img: /ressources/no-pp.jpg
                    role: viewer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Collections]
      operationId: addCollectionMember
      summary: Add an existing user, or create a user and add them
      description: |
        Requires `admin` role on the collection. Body must be JSON. Two modes:

        - `{ identifier }` — an existing user's username or email. Added with the
          given `role` (default `viewer`).
        - `{ username, email }` — creates a brand-new user with a server-generated
          random password, which is returned as `generatedPassword` (show it to the
          admin once; it is not stored in clear).

        Returns 409 if the user is already a member, the identifier matches nobody
        (404), or username/email collide.
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInviteRequest'
            examples:
              existing:
                value: { identifier: 'guest@example.com', role: viewer }
              newUser:
                value: { username: guest, email: guest@example.com, role: editor }
      responses:
        '201':
          description: Member added; `generatedPassword` only present for a newly created user.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member:
                    $ref: '#/components/schemas/CollectionMember'
                  generatedPassword:
                    type: string
                    description: Present only when a new user was created.
              examples:
                existing:
                  value:
                    member:
                      userId: 64f1c2a9e13b2a0012ab34c0
                      username: guest
                      email: guest@example.com
                      role: viewer
                newUser:
                  value:
                    member:
                      userId: 64f1c2a9e13b2a0012ab34c1
                      username: guest
                      email: guest@example.com
                      role: editor
                    generatedPassword: 'k7@Rn2pQ!aZ4'
        '400':
          description: Neither identifier nor username+email supplied, or invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value: { success: false, error: 'Provide either identifier, or username + email' }
                invalid:
                  value: { success: false, error: 'Invalid username or email' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No user matches the identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, error: 'User not found' }
        '409':
          description: Already a member, or a user with that username/email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                member:
                  value: { success: false, error: 'User is already a member' }
                user:
                  value: { success: false, error: 'A user with that username or email already exists' }
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /collections/{id}/members/{userId}:
    patch:
      tags: [Collections]
      operationId: updateCollectionMemberRole
      summary: Change a member's role
      description: |
        Requires `admin` role on the collection. Body must be JSON. Refuses to
        change your own role and to demote the last remaining admin.
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRoleRequest'
            example:
              role: editor
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, enum: [true] }
              example: { success: true }
        '400':
          description: Invalid role/userId, self-change, or demoting the last admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value: { success: false, error: 'Invalid role or userId' }
                self:
                  value: { success: false, error: 'Cannot change your own role' }
                lastAdmin:
                  value: { success: false, error: 'Cannot demote the last admin' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Member not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, error: 'Member not found' }
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Collections]
      operationId: removeCollectionMember
      summary: Remove a member from a collection
      description: |
        Requires `admin` role on the collection. Refuses to remove the last
        remaining admin.
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Member removed.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, enum: [true] }
              example: { success: true }
        '400':
          description: Invalid userId, or removing the last admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value: { success: false, error: 'Invalid userId' }
                lastAdmin:
                  value: { success: false, error: 'Cannot remove the last admin' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Member not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, error: 'Member not found' }
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /collections/{id}/members/{userId}/reset-password:
    post:
      tags: [Collections]
      operationId: resetCollectionMemberPassword
      summary: Reset a collection member's password
      description: |
        Requires `admin` role on the collection. Generates a new random password
        for the member and returns it once. Instance admins cannot be reset this
        way (404). If the member also belongs to another collection, only an
        instance admin may reset them (403).
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: New password generated and returned.
          content:
            application/json:
              schema:
                type: object
                required: [generatedPassword]
                properties:
                  generatedPassword: { type: string }
              example: { generatedPassword: 'g8#Lm2vQ!xW1' }
        '400':
          description: Invalid userId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, error: 'Invalid userId' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Member belongs to another collection and caller is not an instance admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, error: 'This member belongs to another collection too — only an instance admin can reset their password' }
        '404':
          description: Member not found, or target is an instance admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, error: 'Member not found' }
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /collections/{id}/share-links:
    get:
      tags: [Collections]
      operationId: listShareLinks
      summary: List a collection's public share links
      description: Requires `admin` role on the collection.
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      responses:
        '200':
          description: Share links.
          content:
            application/json:
              schema:
                type: object
                required: [shareLinks]
                properties:
                  shareLinks:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShareLink'
              example:
                shareLinks:
                  - token: 3f9a...c21b
                    label: Vinyls only
                    enabled: true
                    scope:
                      - pluginId: music
                        formats: [vinyl, cd]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Collections]
      operationId: createShareLink
      summary: Create a share link
      description: |
        Requires `admin` role on the collection. Body must be JSON. A token is
        generated server-side; the link is enabled by default. `scope` entries
        naming unknown plugins or format values are dropped.
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareLinkRequest'
            example:
              label: Vinyls only
              scope:
                - pluginId: music
                  formats: [vinyl, cd]
      responses:
        '201':
          description: Share link created.
          content:
            application/json:
              schema:
                type: object
                required: [shareLink]
                properties:
                  shareLink:
                    $ref: '#/components/schemas/ShareLink'
              example:
                shareLink:
                  token: 3f9a...c21b
                  label: Vinyls only
                  enabled: true
                  scope:
                    - pluginId: music
                      formats: [vinyl, cd]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /collections/{id}/share-links/{token}:
    patch:
      tags: [Collections]
      operationId: updateShareLink
      summary: Update a share link's label, enabled flag or scope
      description: |
        Requires `admin` role on the collection. Body must be JSON; only the keys
        present are applied. Schema invalidity means `scope` is replaced with the
        filtered valid entries. Returns 400 when no updatable key is present.
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/ShareToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareLinkUpdateRequest'
            example:
              enabled: false
              label: Books only
      responses:
        '200':
          description: Updated share link.
          content:
            application/json:
              schema:
                type: object
                required: [shareLink]
                properties:
                  shareLink:
                    $ref: '#/components/schemas/ShareLink'
              example:
                shareLink:
                  token: 3f9a...c21b
                  label: Books only
                  enabled: false
                  scope: []
        '400':
          description: Nothing to update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, error: 'Nothing to update' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
