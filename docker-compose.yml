services:
  dvinyl-app:
    build: .
    container_name: dvinyl_app
    restart: unless-stopped
    ports:
      - "3099:3099" # External port : Internal port
    volumes:
      # The whole collection is one SQLite file in ./data; back this folder up.
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    env_file:
        - .env

  # Only to upgrade from DVinyl 3.x, which kept its data in MongoDB: the old database,
  # read once by the first start of 4.0 (set MONGODB_URL in .env). Start that first boot
  # with `docker compose --profile upgrade up -d`. Once the import is done, remove it with
  # `docker compose rm -sf mongodb`: a plain `docker compose up -d` never starts it again.
  mongodb:
    image: mongo:latest
    profiles: ["upgrade"]
    container_name: dvinyl_db
    restart: unless-stopped
    volumes:
      - ./mongo_data:/data/db
